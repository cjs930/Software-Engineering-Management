<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Engineering Management</title>
    <style>
      :root {
        --bg: #edf4ff;
        --panel: #ffffff;
        --panel-soft: #f7faff;
        --border: #d7e3f7;
        --text: #1d2b3a;
        --muted: #62748a;
        --primary: #2557d6;
        --primary-strong: #163aab;
        --primary-soft: #eaf1ff;
        --accent: #0ea5e9;
        --shadow: 0 14px 32px rgba(19, 43, 84, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
        background: linear-gradient(180deg, #f8fbff 0%, #edf4ff 100%);
        color: var(--text);
      }

      .page-shell {
        max-width: 1500px;
        margin: 0 auto;
        padding: 28px 22px;
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 24px;
      }

      .sidebar,
      .content {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      .sidebar {
        padding: 22px 18px 18px;
        height: fit-content;
        position: sticky;
        top: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        padding: 6px 8px;
      }

      .brand-badge {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        color: #fff;
        font-size: 1.2rem;
        font-weight: 700;
        box-shadow: 0 8px 18px rgba(37, 87, 214, 0.25);
      }

      .brand h1 {
        margin: 0;
        font-size: 1.5rem;
        color: var(--text);
      }

      .tree,
      .tree ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .tree {
        background: linear-gradient(180deg, #f8fbff 0%, #f2f7ff 100%);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px 12px;
      }

      .tree > ul {
        padding-left: 0;
      }

      .tree li {
        margin: 4px 0;
      }

      .tree-node {
        position: relative;
      }

      .tree-folder,
      .tree-file {
        display: flex;
        align-items: center;
        gap: 6px;
        border-radius: 10px;
        transition: 0.2s ease;
      }

      .tree-folder {
        padding: 4px 8px;
        border: 1px solid transparent;
        cursor: pointer;
      }

      .tree-folder:hover,
      .tree-file:hover {
        background: var(--primary-soft);
      }

      .tree-toggle {
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        border-radius: 6px;
        color: var(--primary);
        font-size: 0.8rem;
        cursor: pointer;
        transition: transform 0.2s ease;
        padding: 0;
      }

      .tree-toggle[aria-expanded="false"] {
        transform: rotate(-90deg);
      }

      .tree-children {
        margin-left: 14px;
        padding-left: 12px;
        border-left: 1px solid var(--border);
      }

      .tree-children.is-collapsed {
        display: none;
      }

      .folder-label,
      .tree-file a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 10px;
        border-radius: 10px;
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
      }

      .folder-label {
        flex: 1;
      }

      .tree-file a {
        padding-left: 8px;
      }

      .tree-icon,
      .file-icon {
        width: 1.1em;
        display: inline-block;
        text-align: center;
        opacity: 0.9;
      }

      .tree-file a:hover {
        background: var(--primary-soft);
        color: var(--primary-strong);
      }

      .content {
        padding: 26px 30px 30px;
      }

      .content-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .header-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary-strong);
        font-weight: 700;
      }

      .last-updated {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .readme {
        color: var(--text);
        line-height: 1.85;
      }

      .readme h1,
      .readme h2,
      .readme h3,
      .readme h4,
      .readme h5,
      .readme h6 {
        margin: 1.4em 0 0.6em;
        color: var(--text);
        line-height: 1.3;
      }

      .readme p,
      .readme ul,
      .readme ol,
      .readme table,
      .readme blockquote,
      .readme pre {
        margin: 0.9em 0;
      }

      .readme a {
        color: var(--primary);
      }

      .readme img {
        max-width: 100%;
        border-radius: 12px;
        border: 1px solid var(--border);
      }

      .readme table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border: 1px solid var(--border);
      }

      .readme th,
      .readme td {
        border: 1px solid var(--border);
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
      }

      .readme th {
        background: #f6f9ff;
      }

      .readme code {
        background: #f3f6fb;
        padding: 2px 6px;
        border-radius: 6px;
        font-family: Consolas, "Courier New", monospace;
      }

      .readme pre {
        background: #0f172a;
        color: #e2e8f0;
        padding: 16px 18px;
        border-radius: 12px;
        overflow-x: auto;
      }

      .readme pre code {
        background: transparent;
        color: inherit;
        padding: 0;
      }

      .readme blockquote {
        border-left: 4px solid var(--primary);
        background: var(--panel-soft);
        padding: 12px 16px;
        color: var(--muted);
      }

      @media (max-width: 960px) {
        .page-shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-badge">📁</div>
          <h1>網站目錄</h1>
        </div>
        <div id="tree" class="tree" aria-live="polite"></div>
      </aside>

      <main class="content">
        <div class="content-header">
          <div class="header-tag">README.md</div>
          <div id="lastUpdated" class="last-updated">載入中…</div>
        </div>
        <article id="readme" class="readme" aria-live="polite"></article>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script>
      const repoConfig = {
        owner: 'cjs930',
        repo: 'Software-Engineering-Management',
        branch: 'main'
      };

      const readmeRoot = document.getElementById('readme');
      const treeRoot = document.getElementById('tree');
      const lastUpdatedNode = document.getElementById('lastUpdated');

      function sortTree(node) {
        if (!node.children || node.children.length === 0) {
          return;
        }

        node.children.sort((a, b) => {
          if (a.type !== b.type) {
            return a.type === 'directory' ? -1 : 1;
          }
          return a.name.localeCompare(b.name, 'zh-Hant');
        });

        node.children.forEach(sortTree);
      }

      function setMainTitle(title) {
        const headerTag = document.querySelector('.header-tag');
        if (headerTag) {
          headerTag.textContent = title;
        }
      }

      function formatFileDate(response) {
        const lastModified = response.headers.get('last-modified');
        if (lastModified) {
          lastUpdatedNode.textContent = '最後更新：' + new Date(lastModified).toLocaleString('zh-TW');
          return;
        }

        lastUpdatedNode.textContent = '最後更新：' + new Date().toLocaleString('zh-TW');
      }

      function renderFileContent(fileName, rawText) {
        const extension = fileName.split('.').pop()?.toLowerCase();

        if (extension === 'md') {
          renderMarkdown(rawText);
          return;
        }

        if (extension === 'html') {
          readmeRoot.innerHTML = DOMPurify.sanitize(rawText);
          return;
        }

        readmeRoot.innerHTML = '<pre>' + DOMPurify.sanitize(rawText) + '</pre>';
      }

      function getRawGithubUrl(filePath) {
        const normalizedPath = filePath.replace(/^\.?\//, '').replace(/\\/g, '/');
        return `https://raw.githubusercontent.com/${repoConfig.owner}/${repoConfig.repo}/${repoConfig.branch}/${normalizedPath}`;
      }

      async function openFileInReader(filePath) {
        try {
          const response = await fetch(getRawGithubUrl(filePath), { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('File not found');
          }

          const fileName = filePath.split('/').pop() || '檔案';
          setMainTitle(fileName);
          formatFileDate(response);
          const text = await response.text();
          renderFileContent(fileName, text);
        } catch (error) {
          console.error(error);
          setMainTitle('檔案無法開啟');
          lastUpdatedNode.textContent = '載入失敗';
          readmeRoot.innerHTML = '<p>檔案無法載入，請稍後再試。</p>';
        }
      }

      function buildTreeBranch(node) {
        const list = document.createElement('ul');

        if (!node || !node.name) {
          return list;
        }

        if (node.type === 'directory') {
          const folderItem = document.createElement('li');
          folderItem.className = 'tree-node';

          const folderWrap = document.createElement('div');
          folderWrap.className = 'tree-folder';

          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'tree-toggle';
          toggle.setAttribute('aria-expanded', 'true');
          toggle.setAttribute('aria-label', '展開/收合 ' + node.name);
          toggle.innerHTML = '<span>▾</span>';

          const folderLabel = document.createElement('div');
          folderLabel.className = 'folder-label';
          folderLabel.innerHTML = '<span class="tree-icon">📁</span><span>' + node.name + '</span>';

          folderWrap.appendChild(toggle);
          folderWrap.appendChild(folderLabel);
          folderItem.appendChild(folderWrap);

          if (node.children && node.children.length > 0) {
            const children = document.createElement('ul');
            children.className = 'tree-children';
            node.children.forEach((child) => children.appendChild(buildTreeBranch(child)));
            folderItem.appendChild(children);

            toggle.addEventListener('click', () => {
              const isExpanded = toggle.getAttribute('aria-expanded') === 'true';
              toggle.setAttribute('aria-expanded', String(!isExpanded));
              children.classList.toggle('is-collapsed', isExpanded);
            });

            folderWrap.addEventListener('click', (event) => {
              if (event.target === toggle || toggle.contains(event.target)) {
                return;
              }
              const isExpanded = toggle.getAttribute('aria-expanded') === 'true';
              toggle.setAttribute('aria-expanded', String(!isExpanded));
              children.classList.toggle('is-collapsed', isExpanded);
            });
          }

          list.appendChild(folderItem);
          return list;
        }

        const item = document.createElement('li');
        item.className = 'tree-node';

        const fileWrap = document.createElement('div');
        fileWrap.className = 'tree-file';

        const link = document.createElement('a');
        link.href = `/file?path=${encodeURIComponent(node.path)}`;
        link.rel = 'noopener noreferrer';
        link.innerHTML = '<span class="file-icon">📄</span><span>' + node.name + '</span>';
        link.addEventListener('click', (event) => {
          event.preventDefault();
          openFileInReader(node.path);
        });

        fileWrap.appendChild(link);
        item.appendChild(fileWrap);
        list.appendChild(item);
        return list;
      }

      function buildRepositoryTree(items) {
        const root = { name: 'root', type: 'directory', children: [] };

        items.forEach((item) => {
          if (!item || !item.path || item.path.startsWith('.git')) {
            return;
          }

          const segments = item.path.split('/').filter(Boolean);
          let current = root;

          segments.forEach((segment, index) => {
            const isLast = index === segments.length - 1;
            const isFile = isLast && item.type === 'blob';

            let child = current.children.find((node) => node.name === segment);
            if (!child) {
              child = {
                name: segment,
                type: isFile ? 'file' : 'directory',
                path: segments.slice(0, index + 1).join('/'),
                children: []
              };
              current.children.push(child);
            }

            if (isFile) {
              child.type = 'file';
              child.path = item.path;
            }

            current = child;
          });
        });

        sortTree(root);
        return root;
      }

      async function loadDirectoryTree() {
        const apiUrl = `https://api.github.com/repos/${repoConfig.owner}/${repoConfig.repo}/git/trees/${repoConfig.branch}?recursive=1`;

        try {
          const response = await fetch(apiUrl, {
            headers: { Accept: 'application/vnd.github+json' }
          });

          if (!response.ok) {
            throw new Error('Unable to read repository tree');
          }

          const data = await response.json();
          const root = buildRepositoryTree(data.tree || []);
          treeRoot.innerHTML = '';

          const rootList = document.createElement('ul');
          root.children.forEach((child) => rootList.appendChild(buildTreeBranch(child)));
          treeRoot.appendChild(rootList);
        } catch (error) {
          console.error(error);
          treeRoot.innerHTML = '<p>無法載入網站目錄。</p>';
        }
      }

      function renderMarkdown(markdownText) {
        const html = marked.parse(markdownText, {
          gfm: true,
          breaks: true,
          headerIds: false
        });
        readmeRoot.innerHTML = DOMPurify.sanitize(html);
      }

      async function loadReadme() {
        try {
          const response = await fetch(getRawGithubUrl('README.md'), { cache: 'no-store' });
          if (!response.ok) {
            throw new Error('README not found');
          }

          const markdownText = await response.text();
          setMainTitle('README.md');
          renderMarkdown(markdownText);
          formatFileDate(response);
        } catch (error) {
          console.error(error);
          readmeRoot.innerHTML = '<p>README.md 無法載入，請稍後再試。</p>';
          lastUpdatedNode.textContent = '載入失敗';
        }
      }

      async function refreshPage() {
        await Promise.all([loadDirectoryTree(), loadReadme()]);
      }

      refreshPage();
      setInterval(refreshPage, 60000);
    </script>
  </body>
</html>

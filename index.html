<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>網站目錄</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --border: #dfe7f3;
        --text: #1d2a39;
        --muted: #62748a;
        --primary: #2a6df6;
        --primary-soft: #edf4ff;
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: linear-gradient(180deg, #f7fafd 0%, #eef4ff 100%);
        color: var(--text);
      }

      .layout {
        display: flex;
        min-height: 100vh;
        gap: 24px;
        padding: 24px;
      }

      .sidebar,
      .content {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .sidebar {
        width: 380px;
        padding: 20px;
      }

      .content {
        flex: 1;
        padding: 24px 28px;
        overflow: auto;
      }

      h1, h2, h3 {
        margin-top: 0;
      }

      .title {
        font-size: 1.6rem;
        margin-bottom: 18px;
        color: var(--text);
      }

      .folder-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        margin: 8px 0;
        color: var(--text);
      }

      .tree,
      .tree ul {
        list-style: none;
        margin: 0;
        padding-left: 18px;
      }

      .tree li {
        margin: 6px 0;
      }

      .tree a {
        color: var(--text);
        text-decoration: none;
        padding: 5px 8px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
      }

      .tree a:hover {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .readme {
        line-height: 1.8;
        color: var(--text);
      }

      .readme h1,
      .readme h2,
      .readme h3,
      .readme h4 {
        margin: 1.2em 0 0.6em;
        color: var(--text);
      }

      .readme p,
      .readme ul,
      .readme ol,
      .readme table {
        margin: 0.8em 0;
      }

      .readme a {
        color: var(--primary);
      }

      .readme table {
        border-collapse: collapse;
        width: 100%;
        border: 1px solid var(--border);
        background: #fff;
      }

      .readme th,
      .readme td {
        border: 1px solid var(--border);
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
      }

      .readme th {
        background: #f5f8ff;
      }

      .readme code {
        background: #f2f4f7;
        padding: 2px 6px;
        border-radius: 6px;
        font-family: Consolas, monospace;
      }

      @media (max-width: 880px) {
        .layout {
          display: block;
        }

        .sidebar {
          width: 100%;
          margin-bottom: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1 class="title">網站目錄</h1>
        <div id="tree"></div>
      </aside>

      <main class="content">
        <h1>README</h1>
        <article id="readme" class="readme"></article>
      </main>
    </div>

    <script>
      const treeRoot = document.getElementById('tree');
      const readmeRoot = document.getElementById('readme');

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getRepoConfig() {
        const params = new URLSearchParams(window.location.search);
        const repoParam = params.get('repo');
        if (repoParam) {
          const [owner, repo] = repoParam.split('/').filter(Boolean);
          if (owner && repo) {
            return { owner, repo, branch: params.get('branch') || 'main' };
          }
        }

        const hostname = window.location.hostname;
        if (hostname.includes('github.io')) {
          const pathParts = window.location.pathname.split('/').filter(Boolean);
          const repo = pathParts[0] || '';
          const owner = hostname.split('.')[0];
          if (owner && repo) {
            return { owner, repo, branch: 'main' };
          }
        }

        return null;
      }

      function getFileLink(node) {
        const repo = getRepoConfig();
        if (repo) {
          return `https://github.com/${repo.owner}/${repo.repo}/blob/${repo.branch}/${node.path}`;
        }
        return '/file?path=' + encodeURIComponent(node.path || '');
      }

      function buildTreeList(node) {
        const list = document.createElement('ul');

        if (node.type === 'directory') {
          const folder = document.createElement('li');
          const folderLabel = document.createElement('div');
          folderLabel.className = 'folder-label';
          folderLabel.innerHTML = '<span>📁</span><span>' + escapeHtml(node.name || '根目錄') + '</span>';
          folder.appendChild(folderLabel);

          if (node.children && node.children.length) {
            const childrenList = document.createElement('ul');
            node.children.forEach((child) => {
              childrenList.appendChild(buildTreeList(child));
            });
            folder.appendChild(childrenList);
          }

          list.appendChild(folder);
          return list;
        }

        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = getFileLink(node);
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.innerHTML = '<span>📄</span><span>' + escapeHtml(node.name) + '</span>';
        item.appendChild(link);
        list.appendChild(item);

        return list;
      }

      function markdownToHtml(markdown) {
        const lines = markdown.replace(/\r\n/g, '\n').split('\n');
        const html = [];
        let listType = null;
        let listItems = [];

        const flushList = () => {
          if (!listType || listItems.length === 0) return;
          html.push(`<${listType}>` + listItems.map(item => `<li>${item}</li>`).join('') + `</${listType}>`);
          listType = null;
          listItems = [];
        };

        const parseInline = (text) => {
          let output = escapeHtml(text);
          output = output.replace(/\[(.+?)\]\((https?:\/\/[^\s)]+|[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
          output = output.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
          output = output.replace(/\*(.+?)\*/g, '<em>$1</em>');
          output = output.replace(/`([^`]+)`/g, '<code>$1</code>');
          return output;
        };

        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i];
          const trimmed = line.trim();

          if (!trimmed) {
            flushList();
            continue;
          }

          if (/^#{1,6}\s+/.test(trimmed)) {
            flushList();
            const match = trimmed.match(/^(#{1,6})\s+(.*)$/);
            const level = match[1].length;
            html.push(`<h${level}>${parseInline(match[2])}</h${level}>`);
            continue;
          }

          if (/^\|.*\|$/.test(trimmed)) {
            flushList();
            const tableRows = [];
            while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) {
              tableRows.push(lines[i].trim());
              i += 1;
            }
            i -= 1;

            if (tableRows.length >= 2) {
              const headerCells = tableRows[0].split('|').slice(1, -1).map(cell => parseInline(cell.trim()));
              const bodyRows = tableRows.slice(1).map(row => row.split('|').slice(1, -1).map(cell => parseInline(cell.trim())));

              html.push('<table><thead><tr>' + headerCells.map(cell => `<th>${cell}</th>`).join('') + '</tr></thead><tbody>');
              bodyRows.forEach(row => {
                html.push('<tr>' + row.map(cell => `<td>${cell}</td>`).join('') + '</tr>');
              });
              html.push('</tbody></table>');
              continue;
            }
          }

          if (/^[-*+]\s+/.test(trimmed)) {
            if (listType !== 'ul') {
              flushList();
              listType = 'ul';
            }
            listItems.push(parseInline(trimmed.replace(/^[-*+]\s+/, '')));
            continue;
          }

          if (/^\d+\.\s+/.test(trimmed)) {
            if (listType !== 'ol') {
              flushList();
              listType = 'ol';
            }
            listItems.push(parseInline(trimmed.replace(/^\d+\.\s+/, '')));
            continue;
          }

          if (/^---+$/.test(trimmed)) {
            flushList();
            html.push('<hr>');
            continue;
          }

          flushList();
          html.push(`<p>${parseInline(trimmed)}</p>`);
        }

        flushList();
        return html.join('');
      }

      async function fetchLocalTree() {
        const response = await fetch('/api/tree');
        if (!response.ok) throw new Error('Local tree API failed');
        return response.json();
      }

      async function fetchGitHubTree(path = '') {
        const repo = getRepoConfig();
        if (!repo) throw new Error('GitHub repo config not found');

        const url = `https://api.github.com/repos/${repo.owner}/${repo.repo}/contents/${path}?ref=${repo.branch}`;
        const response = await fetch(url, {
          headers: {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          },
        });

        if (!response.ok) {
          throw new Error('GitHub directory fetch failed');
        }

        const items = await response.json();
        if (!Array.isArray(items)) {
          return { name: repo.repo, path: '', type: 'directory', children: [] };
        }

        const children = [];
        for (const item of items.sort((a, b) => a.name.localeCompare(b.name))) {
          const node = {
            name: item.name,
            path: item.path,
            type: item.type === 'dir' ? 'directory' : 'file',
          };

          if (item.type === 'dir') {
            node.children = await fetchGitHubTree(item.path);
          }

          children.push(node);
        }

        return {
          name: path ? path.split('/').pop() || repo.repo : repo.repo,
          path,
          type: 'directory',
          children,
        };
      }

      async function loadTree() {
        try {
          const repo = getRepoConfig();
          const tree = repo ? await fetchGitHubTree() : await fetchLocalTree();
          treeRoot.innerHTML = '';
          treeRoot.appendChild(buildTreeList(tree));
        } catch (error) {
          treeRoot.innerHTML = '<p>無法載入目錄資料。</p>';
        }
      }

      async function loadReadme() {
        try {
          const repo = getRepoConfig();
          if (repo) {
            const readmeUrl = `https://api.github.com/repos/${repo.owner}/${repo.repo}/readme?ref=${repo.branch}`;
            const response = await fetch(readmeUrl, {
              headers: {
                Accept: 'application/vnd.github.v3.html',
              },
            });

            if (response.ok) {
              const html = await response.text();
              readmeRoot.innerHTML = html;
              return;
            }

            const raw = await fetch(`https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/${repo.branch}/README.md`);
            if (!raw.ok) throw new Error('README not available');
            const markdown = await raw.text();
            readmeRoot.innerHTML = markdownToHtml(markdown);
            return;
          }

          const response = await fetch('/api/readme');
          if (!response.ok) throw new Error('Local readme API failed');
          readmeRoot.innerHTML = await response.text();
        } catch (error) {
          readmeRoot.innerHTML = '<p>無法載入 README。</p>';
        }
      }

      loadTree();
      loadReadme();
      setInterval(() => {
        loadTree();
        loadReadme();
      }, 15000);
    </script>
  </body>
</html>

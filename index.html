<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Engineering Management</title>
    <meta
      name="description"
      content="網站目錄與檔案列表，支援資料夾展開/收合與 GitHub/新分頁開啟。"
    />
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --panel-alt: #f8fafc;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dfe7f4;
        --primary: #2563eb;
        --primary-soft: rgba(37, 99, 235, 0.08);
        --shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: linear-gradient(180deg, #f7f9fc 0%, #edf3ff 100%);
        color: var(--text);
      }

      a {
        color: var(--primary);
        text-decoration: none;
      }

      .site-header {
        background: linear-gradient(120deg, #0f172a 0%, #1e293b 100%);
        color: white;
        box-shadow: var(--shadow);
      }

      .site-header-inner,
      .container {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
      }

      .site-header-inner {
        padding: 28px 0 18px;
      }

      .site-title {
        margin: 0;
        font-size: clamp(2.1rem, 4vw, 3.2rem);
        line-height: 1.2;
        font-weight: 800;
      }

      .subtitle {
        margin-top: 10px;
        color: rgba(255, 255, 255, 0.82);
        font-size: 0.98rem;
      }

      .main {
        padding: 32px 0 56px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px;
        background: var(--panel-alt);
        border-bottom: 1px solid var(--border);
      }

      .panel-title {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 700;
      }

      .tiny-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 0.78rem;
        font-weight: 700;
        border: 1px solid rgba(37, 99, 235, 0.2);
      }

      .panel-body {
        padding: 18px 18px 20px;
      }

      .tree,
      .tree ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .tree-node {
        margin: 0;
        padding: 0;
      }

      .tree-branch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 52px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.82);
        margin: 8px 0;
      }

      .tree-label {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        color: var(--text);
        font-weight: 600;
        flex: 1;
      }

      .tree-label span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tree-label:hover {
        color: var(--primary);
        text-decoration: none;
      }

      .tree-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .tree-actions a,
      .tree-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(37, 99, 235, 0.36);
        background: transparent;
        color: var(--primary);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 0.82rem;
        cursor: pointer;
        min-width: 84px;
        transition: 0.2s ease;
      }

      .tree-actions a:hover,
      .tree-toggle:hover {
        background: var(--primary-soft);
        text-decoration: none;
      }

      .tree-toggle {
        min-width: 72px;
      }

      .tree-children {
        margin: 0 0 0 18px;
        padding-left: 10px;
        border-left: 1px solid var(--border);
      }

      .tree-node.is-collapsed > .tree-children {
        display: none;
      }

      .readme-content {
        line-height: 1.8;
        color: var(--text);
      }

      .readme-content h1,
      .readme-content h2,
      .readme-content h3,
      .readme-content h4,
      .readme-content h5,
      .readme-content h6 {
        margin-top: 1.5em;
        margin-bottom: 0.6em;
        line-height: 1.35;
      }

      .readme-content h1 {
        font-size: clamp(1.8rem, 2.5vw, 2.6rem);
        padding-bottom: 0.4em;
        border-bottom: 1px solid var(--border);
      }

      .readme-content h2 {
        font-size: 1.45rem;
      }

      .readme-content p,
      .readme-content li {
        color: #1f2937;
      }

      .readme-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
        border: 1px solid var(--border);
      }

      .readme-content th,
      .readme-content td {
        padding: 10px 12px;
        border: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }

      .readme-content th {
        background: #f8fafc;
      }

      .readme-content code {
        background: #f1f5f9;
        border-radius: 6px;
        padding: 0.2em 0.45em;
        font-family: "Consolas", "Courier New", monospace;
      }

      .readme-content pre {
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        overflow-x: auto;
      }

      .readme-content blockquote {
        margin: 1rem 0;
        padding: 0.8rem 1rem;
        border-left: 4px solid var(--primary);
        background: var(--primary-soft);
        border-radius: 0 10px 10px 0;
      }

      .readme-content ul,
      .readme-content ol {
        padding-left: 1.5rem;
      }

      .readme-content a {
        color: var(--primary);
      }

      .empty-state {
        color: var(--muted);
        padding: 12px 8px;
      }

      @media (max-width: 760px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <h1 class="site-title">Software Engineering Management</h1>
        <div class="subtitle">
          GitHub Pages:
          <a
            href="https://cjs930.github.io/Software-Engineering-Management/"
            target="_blank"
            rel="noopener"
            style="color: #fff; text-decoration: underline;"
          >
            cjs930.github.io/Software-Engineering-Management
          </a>
          ｜ branch: main
        </div>
      </div>
    </header>

    <main class="main">
      <div class="container layout">
        <section class="panel" aria-labelledby="directory-title">
          <div class="panel-header">
            <h2 id="directory-title" class="panel-title">網站目錄與檔案</h2>
            <span class="tiny-badge">自動讀取 GitHub</span>
          </div>
          <div class="panel-body">
            <ul id="repoTree" class="tree" aria-live="polite"></ul>
          </div>
        </section>

        <section class="panel" aria-labelledby="readme-title">
          <div class="panel-header">
            <h2 id="readme-title" class="panel-title">README.md</h2>
            <a
              class="tiny-badge"
              href="https://github.com/cjs930/Software-Engineering-Management"
              target="_blank"
              rel="noopener"
            >
              開啟 GitHub
            </a>
          </div>
          <div class="panel-body">
            <article id="readmeContent" class="readme-content">載入中...</article>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      (function () {
        const owner = 'cjs930';
        const repo = 'Software-Engineering-Management';
        const branch = 'main';
        const siteRoot = 'https://cjs930.github.io/Software-Engineering-Management/';
        const treeEl = document.getElementById('repoTree');
        const readmeEl = document.getElementById('readmeContent');

        function normalizeTree(items) {
          return (items || [])
            .filter((item) => item && item.path)
            .filter((item) => !item.path.startsWith('.git'))
            .filter((item) => !item.path.startsWith('.github'))
            .sort((a, b) => {
              const aType = a.type === 'tree' ? 0 : 1;
              const bType = b.type === 'tree' ? 0 : 1;
              if (aType !== bType) return aType - bType;
              return a.path.localeCompare(b.path, 'zh-Hant');
            });
        }

        function buildTreeMap(items) {
          const map = new Map();
          const roots = [];

          items.forEach((item) => {
            const path = item.path;
            const name = path.split('/').pop();
            const parentPath = path.includes('/') ? path.split('/').slice(0, -1).join('/') : '';

            const node = {
              ...item,
              name,
              parentPath,
              children: []
            };

            map.set(path, node);

            if (!parentPath) {
              roots.push(node);
            }
          });

          items.forEach((item) => {
            const parentPath = item.path.includes('/') ? item.path.split('/').slice(0, -1).join('/') : '';
            if (parentPath && map.has(parentPath)) {
              map.get(parentPath).children.push(map.get(item.path));
            }
          });

          roots.forEach((root) => {
            root.children.sort((a, b) => {
              const aType = a.type === 'tree' ? 0 : 1;
              const bType = b.type === 'tree' ? 0 : 1;
              if (aType !== bType) return aType - bType;
              return a.name.localeCompare(b.name, 'zh-Hant');
            });
          });

          return roots;
        }

        function createTreeItem(node) {
          const li = document.createElement('li');
          li.className = 'tree-node';

          const isDir = node.type === 'tree';
          const hasChildren = Array.isArray(node.children) && node.children.length > 0;
          const safePath = encodeURI(node.path);
          const repoPathUrl = isDir
            ? `https://github.com/${owner}/${repo}/tree/${branch}/${safePath}`
            : `https://github.com/${owner}/${repo}/blob/${branch}/${safePath}`;
          const siteOpenUrl = isDir
            ? repoPathUrl
            : `${siteRoot}${safePath}`;

          const row = document.createElement('div');
          row.className = 'tree-branch';

          const label = document.createElement('a');
          label.className = 'tree-label';
          label.href = repoPathUrl;
          label.target = '_blank';
          label.rel = 'noopener noreferrer';
          label.innerHTML = `${isDir ? '📁' : '📄'} <span>${node.name}${isDir ? '/' : ''}</span>`;

          const actions = document.createElement('div');
          actions.className = 'tree-actions';

          if (isDir && hasChildren) {
            const toggleBtn = document.createElement('button');
            toggleBtn.type = 'button';
            toggleBtn.className = 'tree-toggle';
            toggleBtn.textContent = '展開';
            toggleBtn.setAttribute('aria-expanded', 'true');
            toggleBtn.addEventListener('click', () => {
              const willCollapse = !li.classList.contains('is-collapsed');
              li.classList.toggle('is-collapsed', willCollapse);
              toggleBtn.textContent = willCollapse ? '收合' : '展開';
              toggleBtn.setAttribute('aria-expanded', String(!willCollapse));
            });
            actions.appendChild(toggleBtn);
          }

          if (!isDir) {
            const openLink = document.createElement('a');
            openLink.href = siteOpenUrl;
            openLink.target = '_blank';
            openLink.rel = 'noopener noreferrer';
            openLink.textContent = '在新分頁開啟';
            actions.appendChild(openLink);
          }

          const githubLink = document.createElement('a');
          githubLink.href = repoPathUrl;
          githubLink.target = '_blank';
          githubLink.rel = 'noopener noreferrer';
          githubLink.textContent = 'GitHub';
          actions.appendChild(githubLink);

          row.appendChild(label);
          row.appendChild(actions);
          li.appendChild(row);

          if (isDir && hasChildren) {
            const childList = document.createElement('ul');
            childList.className = 'tree-children';
            node.children.forEach((child) => childList.appendChild(createTreeItem(child)));
            li.appendChild(childList);
          }

          return li;
        }

        async function loadTree() {
          try {
            const repoMetaRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
            if (!repoMetaRes.ok) throw new Error('Repository metadata request failed');
            const repoMeta = await repoMetaRes.json();
            const defaultBranch = repoMeta.default_branch || branch;

            const treeRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${defaultBranch}?recursive=1`);
            if (!treeRes.ok) throw new Error('GitHub tree request failed');

            const treeData = await treeRes.json();
            const items = normalizeTree(treeData.tree || []);

            if (!items.length) {
              treeEl.innerHTML = '<li class="empty-state">目前沒有可顯示的檔案。</li>';
              return;
            }

            const roots = buildTreeMap(items);
            roots.forEach((root) => treeEl.appendChild(createTreeItem(root)));
          } catch (error) {
            console.error(error);
            treeEl.innerHTML = '<li class="empty-state">無法載入目錄資料，請稍後再試。</li>';
          }
        }

        async function loadReadme() {
          try {
            const repoMetaRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
            if (!repoMetaRes.ok) throw new Error('Repository metadata request failed');
            const repoMeta = await repoMetaRes.json();
            const currentBranch = repoMeta.default_branch || branch;
            const readmeUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${currentBranch}/README.md`;
            const readmeRes = await fetch(readmeUrl);

            if (!readmeRes.ok) {
              throw new Error('README fetch failed');
            }

            const markdown = await readmeRes.text();
            if (window.marked && typeof window.marked.parse === 'function') {
              readmeEl.innerHTML = window.marked.parse(markdown);
            } else {
              readmeEl.textContent = markdown;
            }
          } catch (error) {
            console.error(error);
            readmeEl.innerHTML = '<p>無法載入 README.md 內容，請稍後再試。</p>';
          }
        }

        loadTree();
        loadReadme();
      })();
    </script>
  </body>
</html>
